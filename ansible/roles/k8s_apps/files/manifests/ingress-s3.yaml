apiVersion: v1
kind: Service
metadata:
  name: truenas-s3
  namespace: default
spec:
  type: ExternalName
  externalName: 10.10.10.20
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: truenas-s3
  namespace: default
  annotations:
    # forward-auth Authentik pour protéger l'accès
    traefik.ingress.kubernetes.io/router.middlewares: default-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: s3.labinfosec.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: truenas-s3
                port:
                  number: 9000
