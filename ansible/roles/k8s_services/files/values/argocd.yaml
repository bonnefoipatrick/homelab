configs:
  params:
    server.insecure: true   # TLS terminé par Traefik
server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.homelab.local
  extraArgs:
    - --insecure
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
redis:
  resources:
    limits:
      memory: 128Mi
