---
# Services activables/désactivables individuellement.
# ATTENTION : sur un mini PC 16 Go, tout activer en même temps ne tiendra pas.
# Splunk seul réclame ~4 Go ; Spark ~3 Go.

enable_grafana: true
enable_influxdb: true
enable_telegraf: true    # dépend d'InfluxDB
enable_vault: true
enable_argocd: true
enable_jenkins: true
enable_gitea: true       # remplace GitLab : ~0,3 Go au lieu de ~8 Go

# Services lourds : désactivés par défaut
enable_spark: false       # bitnami/spark : ~2-3 Go
enable_splunk: false      # splunk-enterprise : >= 4 Go, licence gratuite 500 Mo/j

# Nommage ingress
domain: "homelab.local"
