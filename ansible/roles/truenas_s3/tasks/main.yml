- name: Vérifier la présence du service MinIO/S3
  ansible.builtin.wait_for:
    host: "{{ truenas_s3_host }}"
    port: "{{ truenas_s3_port }}"
    timeout: 60

- name: Installer le client mc
  ansible.builtin.get_url:
    url: "https://dl.min.io/client/mc/release/linux-amd64/mc"
    dest: /usr/local/bin/mc
    mode: "0755"

- name: Créer l'alias S3 homelab
  ansible.builtin.command:
    argv:
      - mc
      - alias
      - set
      - homelab
      - "http://{{ truenas_s3_host }}:{{ truenas_s3_port }}"
      - "{{ s3_access_key }}"
      - "{{ s3_secret_key }}"
  no_log: true

- name: Créer le bucket par défaut
  ansible.builtin.command:
    argv: [mc, mb, --ignore-existing, homelab/homelab-data]
  no_log: true
